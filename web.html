<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML + JS Demo</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        header, footer { background: aqua; padding: 10px; text-align: center; }
        main { margin: 20px 0; }
        button { padding: 8px 16px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Semantic Tags -->
    <header>
        <h1>Welcome to My Page</h1>
    </header>

    <nav>
        <a href="#home">Home</a> |
        <a href="#about">About</a>
    </nav>

    <main>
        <section id="home">
            <h2>Home Section</h2>
            <p>This paragraph will be updated by JavaScript.</p>
            <button onclick="runJS()">Click Me</button>
        </section>

        <section id="about">
            <h2>About Section</h2>
            <div id="output"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Demo Page</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
